aid: beyond-meat
name: Beyond Meat
description: 'Beyond Meat, Inc. is a Los Angeles-based producer of plant-based meat substitutes founded
  in 2009 and publicly traded on Nasdaq (BYND). The company makes plant-protein versions of beef, pork,
  and poultry products, including the Beyond Burger, Beyond Sausage, Beyond Beef, and Beyond Chicken,
  distributed across grocery retail and foodservice channels worldwide. Beyond Meat operates as a consumer
  packaged-goods brand rather than a technology or developer-platform company; it publishes a marketing
  and e-commerce website, product and recipe catalogs, a newsroom, and an investor-relations presence,
  but does not offer a public developer API. This profile was surfaced as a portfolio company of Kleiner
  Perkins and Obvious Ventures and added to the API Evangelist network as a company record.'
